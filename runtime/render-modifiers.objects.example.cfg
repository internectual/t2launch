# T2Launch per-frame object modifiers
#
# Select this file with the `render.object_rules` hook option. These assignments
# run every frame, so a HUD script that moves/rebuilds a control cannot undo the
# configured placement for more than one frame.
#
# Syntax:
#   client|server frame ObjectPattern.FieldPattern = value
#
# `class:Pattern` matches Torque class names. `*` matches any number of
# characters and `?` matches one in both object/class and field patterns. The
# same value is assigned to every matching field. Keep selectors and field
# patterns narrow; an unknown/missing target is simply skipped.
#
# Examples (uncomment and adapt to your HUD):
# client frame navHud.position = "20 30"
# client frame PlayGui.extent = "1024 768"
# client frame class:GuiBitmapCtrl.visible = 1
#
# `position` and `extent` use the control's coordinate space. Prefer exact
# fields when controls of one class have different layout roles.
#
# Conditional form (test a field of the same object, then change another):
# client frame navHud.visible = 1 ? position = "20 30"
