# t2launch datablock overrides -- template.
#
# The hook reads this file (path in T2LAUNCH_DATABLOCK_CONFIG) and, in-game,
# re-applies each line every half second through the engine's own script
# interface. It is presentational only: it changes how datablocks look, never
# gameplay state. Format, one entry per line:
#
#     Object.field = value
#
# A bare word/filename is quoted automatically; a number or vector is passed
# through; an already-"quoted" value is used verbatim. Lines starting with # or
# blank are ignored.
#
# NOTE on model swaps: for demo review, hm2's replacement SHAPES are installed
# as loose files (base/shapes/*.dts), which override the stock models directly
# and reliably -- no datablock redirect needed, and better than redirecting a
# datablock whose shape is already preloaded (that leaves the object blank).
# Use datablock redirects for shapes only when a loose override is not possible.
#
# This feature's real purpose is live field overrides -- e.g. Sun/Sky weather
# applied once after connecting to a server. Examples (commented out):
#
#   # Sky.fogDistance = 150
#   # Sky.fogColor = "0.6 0.6 0.7 1.0"
#   # Sun.ambient = "0.3 0.3 0.4"
#   # Sun.direction = "0.5 0.5 -0.7"
#
# Add your own lines below.
