# T2Launch datablock/render modifiers
#
# Select this file with the `render.datablock_rules` hook option. The hook
# evaluates each assignment through TorqueScript; an empty option path disables
# the feature. Lines beginning with # and blank lines are ignored.
#
# Syntax:
#   client|server|both connect|frame ObjectPattern.FieldPattern = value
#
# `connect` rules are re-applied when the connection/mission changes, and
# retried for a short window while the mission's objects arrive.
# `frame` rules are re-applied every frame. Use class:Pattern to match an
# object's Torque class instead of its name. `*` matches any number of
# characters and `?` matches one. Both object/class and field patterns may use
# wildcards. A rule applies the same value to every matching field; use broad
# field patterns carefully. Bare strings are quoted, numeric values/vectors are
# passed through, and quoted strings are preserved.
#
# The minimal zGridSkyBox.vl2 contains this single DML and only its six Grid_*
# face textures. The DML uses the stock lush sky environment map from lush.vl2.
# The launcher install copies the grid volume into base/.
client connect class:Sky.materialList = "grid.dml"
client connect Sky.materialList = "grid.dml"
client connect MissionSky.materialList = "grid.dml"

# Keep enforcing it during map loading, too. Exact object names are resolved
# directly; class:Sky covers map-specific Sky object names when they are grouped.
client frame class:Sky.materialList = "grid.dml"
client frame Sky.materialList = "grid.dml"
client frame MissionSky.materialList = "grid.dml"

# Some maps leave Sky.useSkyTextures off, so no skybox faces are drawn at all
# (the grid sky would stay invisible). Turn them on for every Sky.
client connect class:Sky.useSkyTextures = 1
client frame class:Sky.useSkyTextures = 1

# Conditional form: Object.testField <op> value [& field <op> value]... ? field = value[, ...]
# Operators: = and != (glob or numeric), < > <= >= (numeric). The actions apply
# to the same object, only when every test passes. For example, swap only the
# stock lush sky and leave other skies alone:
# client frame class:Sky.materialList = "*lush*" ? materialList = "grid.dml"

# Example class selector and field wildcard (commented; intentionally broad):
# client frame class:Gui*.*position* = "20 30"
