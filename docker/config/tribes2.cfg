USE_GAMESCOPE=0
SOFTWARE_GL=0
USE_STRACE=0
USE_PADSP=${USE_PADSP:-1}
USE_PULSE_ALSA=1
USE_GAME_WINDOW_RESIZE=1
USE_SDL_X11_NODIRECTCOLOR=1
GAME_BINARY="./tribes2.dynamic"
LOAD_HOOK=1

# Let Tribes 2 control its own window dimensions from the selected video mode.
# FULLSCREEN=true (or an explicit -f/--fullscreen argument) requests fullscreen.
_T2_FULLSCREEN_REQUESTED=0
case "${FULLSCREEN,,}" in
    1|true|yes|on)
        GAME_ARGS+=(--fullscreen)
        _T2_FULLSCREEN_REQUESTED=1
        ;;
esac
for _T2_ARG in "${GAME_ARGS[@]}"; do
    case "$_T2_ARG" in
        -f|--fullscreen) _T2_FULLSCREEN_REQUESTED=1 ;;
    esac
done
if [[ "$_T2_FULLSCREEN_REQUESTED" != "1" ]]; then
    GAME_ARGS+=(--windowed)
fi
unset _T2_ARG _T2_FULLSCREEN_REQUESTED
